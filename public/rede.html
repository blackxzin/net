<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Rede</title>
<style>
  :root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #202020;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- login gate ---------- */
  #login-gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #login-card {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 24px;
  }
  #login-card h1 {
    font-size: 18px;
    margin: 0 0 4px;
  }
  #login-card p {
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 20px;
  }
  #login-card input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 14px;
  }
  #login-card button, .action-btn {
    width: 100%;
    padding: 10px 12px;
    background: #2a78d6;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #login-card button:hover, .action-btn:hover { background: #1c5cab; }
  #login-erro {
    color: var(--critical);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------- dashboard ---------- */
  #dashboard { display: none; max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }

  header.topo {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }
  header.topo h1 { font-size: 20px; margin: 0; letter-spacing: 0.2px; }
  #relogio { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .aviso-simulado {
    display: inline-block;
    margin: 6px 0 24px;
    padding: 4px 10px;
    font-size: 11px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--warning);
    border: 1px solid var(--warning);
    border-radius: 999px;
  }

  .toolbar { display: flex; gap: 10px; margin-bottom: 24px; }
  .toolbar .action-btn { width: auto; padding: 8px 16px; font-size: 13px; }
  #sair-btn { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
  #sair-btn:hover { background: var(--surface-2); }

  /* stat tiles */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-tile .valor {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .stat-tile .rotulo {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 4px;
  }
  .stat-tile.good .valor { color: var(--good); }
  .stat-tile.warning .valor { color: var(--warning); }
  .stat-tile.critical .valor { color: var(--critical); }

  section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin: 0 0 12px;
    border-bottom: 1px solid var(--gridline);
    padding-bottom: 8px;
  }

  /* point cards */
  .pontos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .ponto-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gridline);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .ponto-card.online { border-left-color: var(--good); }
  .ponto-card.instavel { border-left-color: var(--warning); }
  .ponto-card.offline { border-left-color: var(--critical); }

  .ponto-card .topo-card { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ponto-card .nome { font-size: 14px; font-weight: 600; }
  .ponto-card .tipo { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }
  .status-pill.online { color: var(--good); background: rgba(12,163,12,0.12); }
  .status-pill.instavel { color: var(--warning); background: rgba(250,178,25,0.12); }
  .status-pill.offline { color: var(--critical); background: rgba(208,59,59,0.12); }
  .status-pill svg { width: 10px; height: 10px; }

  .ponto-metricas {
    display: flex; gap: 16px; margin-top: 12px;
    font-size: 12px; color: var(--text-secondary);
  }
  .ponto-metricas b { color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .ponto-atualizado { margin-top: 8px; font-size: 11px; color: var(--text-muted); }

  /* alerts */
  #alertas-lista { display: flex; flex-direction: column; gap: 8px; }
  .alerta-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--critical);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .alerta-item .msg { color: var(--text-primary); }
  .alerta-item .quando { color: var(--text-muted); font-size: 11px; margin-left: 8px; }
  .resolver-btn {
    padding: 5px 12px; font-size: 12px; border-radius: 6px;
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer;
  }
  .resolver-btn:hover { background: var(--surface-2); color: var(--text-primary); }
  #sem-alertas { color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>

<div id="login-gate">
  <div id="login-card">
    <h1>Painel de Rede</h1>
    <p>Entre com sua conta do sistema pra ver o status de POPs e CTOs.</p>
    <input id="login-email" type="email" placeholder="email" value="admin@teste.com" autocomplete="username">
    <input id="login-senha" type="password" placeholder="senha" value="admin123" autocomplete="current-password">
    <button id="login-btn">Entrar</button>
    <div id="login-erro"></div>
  </div>
</div>

<div id="dashboard">
  <header class="topo">
    <h1>Painel de Rede</h1>
    <span id="relogio"></span>
  </header>
  <div><span class="aviso-simulado">⚠ dados simulados — sem SNMP/API real ainda</span></div>

  <div class="toolbar">
    <button class="action-btn" id="verificar-btn">Verificar agora</button>
    <button class="action-btn" id="sair-btn">Sair</button>
  </div>

  <div class="stat-grid" id="stat-grid"></div>

  <section>
    <h2>Pontos de rede</h2>
    <div class="pontos-grid" id="pontos-grid"></div>
  </section>

  <section>
    <h2>Alertas abertos</h2>
    <div id="alertas-lista"></div>
  </section>
</div>

<script>
(() => {
  const ICONES = {
    online: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="2"/><path d="M5 8.3l2 2 4-4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    instavel: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 1.5l7 12.5H1L8 1.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6.5v3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="12" r="0.9" fill="currentColor"/></svg>',
    offline: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="2"/><path d="M5.5 5.5l5 5M10.5 5.5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  };
  const ROTULOS = { online: 'Online', instavel: 'Instável', offline: 'Offline' };

  const el = (id) => document.getElementById(id);
  let token = sessionStorage.getItem('net_token') || '';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  async function api(caminho, opcoes = {}) {
    const res = await fetch(caminho, {
      ...opcoes,
      headers: { 'content-type': 'application/json', authorization: `Bearer ${token}`, ...(opcoes.headers || {}) },
    });
    if (res.status === 401) { logout(); throw new Error('sessao expirada'); }
    return res.json();
  }

  function logout() {
    token = '';
    sessionStorage.removeItem('net_token');
    el('dashboard').style.display = 'none';
    el('login-gate').style.display = 'flex';
  }

  function tempoRelativo(isoUtc) {
    const data = new Date(isoUtc.replace(' ', 'T') + 'Z');
    const segundos = Math.round((data - new Date()) / 1000);
    const rtf = new Intl.RelativeTimeFormat('pt-BR', { numeric: 'auto' });
    if (Math.abs(segundos) < 60) return rtf.format(segundos, 'second');
    if (Math.abs(segundos) < 3600) return rtf.format(Math.round(segundos / 60), 'minute');
    return rtf.format(Math.round(segundos / 3600), 'hour');
  }

  function renderStats(pontos, alertas) {
    const online = pontos.filter((p) => p.status === 'online').length;
    const instavel = pontos.filter((p) => p.status === 'instavel').length;
    const offline = pontos.filter((p) => p.status === 'offline').length;
    const uptimeMedio = pontos.length
      ? (pontos.reduce((soma, p) => soma + p.uptime_percentual, 0) / pontos.length).toFixed(2)
      : '0.00';

    const tiles = [
      { valor: pontos.length, rotulo: 'Pontos monitorados', classe: '' },
      { valor: online, rotulo: 'Online', classe: 'good' },
      { valor: instavel, rotulo: 'Instáveis', classe: instavel > 0 ? 'warning' : '' },
      { valor: offline, rotulo: 'Offline', classe: offline > 0 ? 'critical' : '' },
      { valor: `${uptimeMedio}%`, rotulo: 'Uptime médio', classe: '' },
      { valor: alertas.length, rotulo: 'Alertas abertos', classe: alertas.length > 0 ? 'critical' : '' },
    ];

    el('stat-grid').innerHTML = tiles.map((t) => `
      <div class="stat-tile ${t.classe}">
        <div class="valor">${t.valor}</div>
        <div class="rotulo">${t.rotulo}</div>
      </div>`).join('');
  }

  function renderPontos(pontos) {
    el('pontos-grid').innerHTML = pontos.map((p) => `
      <div class="ponto-card ${p.status}">
        <div class="topo-card">
          <div>
            <div class="nome">${escapeHtml(p.nome)}</div>
            <div class="tipo">${p.tipo}</div>
          </div>
          <span class="status-pill ${p.status}">${ICONES[p.status]}${ROTULOS[p.status]}</span>
        </div>
        <div class="ponto-metricas">
          <span>Latência: <b>${p.latencia_ms != null ? p.latencia_ms + ' ms' : '—'}</b></span>
          <span>Uptime: <b>${p.uptime_percentual}%</b></span>
        </div>
        <div class="ponto-atualizado">atualizado ${tempoRelativo(p.atualizado_em)}</div>
      </div>`).join('');
  }

  function renderAlertas(alertas) {
    if (!alertas.length) {
      el('alertas-lista').innerHTML = '<div id="sem-alertas">Nenhum alerta aberto no momento.</div>';
      return;
    }
    el('alertas-lista').innerHTML = alertas.map((a) => `
      <div class="alerta-item">
        <div>
          <span class="msg">${escapeHtml(a.ponto_nome)} — ${escapeHtml(a.mensagem)}</span>
          <span class="quando">${tempoRelativo(a.criado_em)}</span>
        </div>
        <button class="resolver-btn" data-id="${a.id}">Resolver</button>
      </div>`).join('');

    el('alertas-lista').querySelectorAll('.resolver-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        await api(`/rede/alertas/${btn.dataset.id}/resolver`, { method: 'PATCH' });
        carregar();
      });
    });
  }

  let ultimoSnapshot = '';
  async function carregar() {
    try {
      const [pontos, alertas] = await Promise.all([api('/rede/pontos'), api('/rede/alertas')]);
      const snapshot = JSON.stringify([pontos, alertas]);
      if (snapshot === ultimoSnapshot) return; // nada mudou: nao redesenha e nao perde foco/clique em andamento
      ultimoSnapshot = snapshot;
      renderStats(pontos, alertas);
      renderPontos(pontos);
      renderAlertas(alertas);
    } catch (e) { /* logout ja tratou sessao expirada */ }
  }

  function atualizarRelogio() {
    el('relogio').textContent = new Date().toLocaleTimeString('pt-BR');
  }

  el('login-btn').addEventListener('click', async () => {
    el('login-erro').textContent = '';
    const email = el('login-email').value.trim();
    const senha = el('login-senha').value;
    const res = await fetch('/auth/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email, senha }),
    });
    if (!res.ok) { el('login-erro').textContent = 'credenciais invalidas'; return; }
    const data = await res.json();
    token = data.token;
    sessionStorage.setItem('net_token', token);
    el('login-gate').style.display = 'none';
    el('dashboard').style.display = 'block';
    iniciar();
  });

  el('login-senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('login-btn').click(); });

  el('sair-btn').addEventListener('click', logout);
  el('verificar-btn').addEventListener('click', async () => {
    await api('/rede/verificar', { method: 'POST' });
    carregar();
  });

  let intervalo;
  function iniciar() {
    atualizarRelogio();
    carregar();
    clearInterval(intervalo);
    intervalo = setInterval(() => { atualizarRelogio(); carregar(); }, 5000);
  }

  if (token) {
    el('login-gate').style.display = 'none';
    el('dashboard').style.display = 'block';
    iniciar();
  }
})();
</script>
</body>
</html>
